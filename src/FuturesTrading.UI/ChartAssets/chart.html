<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Chart</title>
  <style>
    html, body { margin: 0; height: 100%; background: #131722; overflow: hidden; }
    #chart { position: absolute; inset: 0; }
    #toast {
      position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
      padding: 6px 14px; border-radius: 4px; font: bold 13px sans-serif; color: #fff;
      pointer-events: none; opacity: 0; transition: opacity .2s; z-index: 10; max-width: 90%;
    }
    #toast.visible { opacity: 1; }
  </style>
  <script src="lightweight-charts.js"></script>
</head>
<body>
  <div id="chart"></div>
  <div id="toast"></div>
  <script>
    // Los tiempos que recibe esta página ya vienen como "hora de pared de Nueva York disfrazada de
    // UTC": Lightweight Charts dibuja el timestamp como dígitos UTC literales, sin convertir a la
    // zona del equipo (ver CandleChartPanel.FakeUtcEpochSeconds).
    const chart = LightweightCharts.createChart(document.getElementById('chart'), {
      autoSize: true,
      layout: { background: { color: '#131722' }, textColor: '#d1d4dc' },
      grid: { vertLines: { color: '#1e222d' }, horzLines: { color: '#1e222d' } },
      timeScale: { timeVisible: true, secondsVisible: false, rightOffset: 6 },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
    });

    const series = chart.addCandlestickSeries({
      upColor: '#26a69a', downColor: '#ef5350', borderVisible: false,
      wickUpColor: '#26a69a', wickDownColor: '#ef5350',
    });

    // ---- Granularidad (tick size) ---------------------------------------------------------------
    // El precio de un futuro se mueve de tick en tick. Con el tick size configurado, el eje y el
    // crosshair avanzan por ticks y muestran los decimales propios del tick (0.25 -> 2, 1 -> 0,
    // 0.1 -> 1); las líneas DZ/SZ se ajustan a esa cuadrícula. Sin tick size (0) no hay ajuste.
    let tickSize = 0;
    let tickPrecision = 2;
    let tickValue = 0;   // USD por tick (1 contrato); 0 = sin dato, la zona no muestra su valor

    function decimalsOf(value) {
      const text = String(value);
      const dot = text.indexOf('.');
      return dot === -1 ? 0 : text.length - dot - 1;
    }

    function configureTick(size, value) {
      tickValue = value > 0 ? value : 0;
      if (!(size > 0)) { tickSize = 0; return; }
      tickSize = size;
      tickPrecision = decimalsOf(size);
      series.applyOptions({ priceFormat: { type: 'price', precision: tickPrecision, minMove: size } });
    }

    // Tick más cercano al precio. toFixed corrige el error de coma flotante (0.1 * 3 = 0.30000000000000004).
    function snapToTick(price) {
      if (tickSize <= 0) return price;
      return Number((Math.round(price / tickSize) * tickSize).toFixed(tickPrecision));
    }

    // Crea la vela si su tiempo es nuevo, o actualiza la que está en formación si es el mismo.
    // Última vela y cantidad de velas cargadas: permiten dibujar a la derecha de la última vela
    // (donde el gráfico no tiene datos) extrapolando el tiempo en pasos de una vela.
    const BAR_SECONDS = 15 * 60;
    let lastBarTime = null;
    let barCount = 0;

    function upsertCandle(candle) {
      if (lastBarTime === null || candle.time > lastBarTime) {
        lastBarTime = candle.time;
        barCount += 1;
      }
      series.update(candle);
    }

    // El hub puede entregar varios días de velas; por defecto se ven las últimas 24 h (96 velas de
    // 15 min) y el resto queda disponible desplazándose hacia la izquierda.
    const VISIBLE_BARS = 96;

    // Reemplaza toda la serie (snapshot del hub: velas cerradas + la que está en formación).
    let firstBarTime = null;

    function loadHistory(candles) {
      series.setData(candles);
      firstBarTime = candles.length > 0 ? candles[0].time : null;
      lastBarTime = candles.length > 0 ? candles[candles.length - 1].time : null;
      barCount = candles.length;
      const count = candles.length;
      if (count > VISIBLE_BARS) {
        chart.timeScale().setVisibleLogicalRange({ from: count - VISIBLE_BARS, to: count + 6 });
      } else {
        chart.timeScale().fitContent();
      }
    }

    // ---- DZ/SZ: zonas de Demanda (verde) y Supply (roja) -------------------------------------
    // Con el modo armado, el 1er click dibuja la línea verde (Demanda) y fija el eje X de la zona;
    // el 2º click dibuja la roja (Supply) en ese mismo X, paralela a la verde. Sigue alternando
    // hasta desarmar. Cada línea va desde ese punto hasta el borde derecho y está anclada al
    // TIEMPO, así que se mantiene bien al hacer zoom/pan. Entre las dos líneas se rellena un tinte
    // suave. Solo el precio de la verde se muestra en el eje derecho.

    const DEMAND_COLOR = '#26a69a';
    const SUPPLY_COLOR = '#ef5350';

    // Risk:Reward: dos líneas grises discontinuas de largo FIJO (en px de pantalla) entre el click 1
    // y el 2, con el riesgo en USD a su derecha. Comparte con DZ/SZ la selección, borrado y guardado.
    const RR_COLOR = '#9598a1';
    // Valores de Risk:Reward: riesgo en USD (rojo), objetivos/profit en USD (verde), riesgo en ticks (amarillo).
    const RR_RISK_TEXT = '#ef5350';
    const RR_PROFIT_TEXT = '#26a69a';
    const RR_TICKS_TEXT = '#ffd54f';
    const RR_LENGTH_PX = 30;

    let armedKind = null;     // modo de dibujo activo: 'dzsz' | 'rr' | null (desarmado)
    let dzSzPending = null;   // zona con el 1er click ya dibujado, esperando el 2º (de cualquier tipo)
    const zones = [];         // [{ kind, demand: {time, price}, supply: {time, price} | null, labels: [] }]
    let zonesAttached = false;
    let selectedZone = null;  // zona elegida con un click (con el modo DZ/SZ desarmado)

    // timeToCoordinate puede LANZAR (no solo devolver null) para un tiempo que no cae en una
    // barra; si lanzara dentro de draw() se congelaría el render de todo el panel.
    function safeTimeToCoordinate(timeScale, time) {
      try { return timeScale.timeToCoordinate(time); } catch { return null; }
    }

    // Una zona guardada puede haber nacido antes de la primera vela que el hub entrega hoy: en ese
    // caso se dibuja desde el borde izquierdo en vez de desaparecer.
    function xOf(timeScale, time) {
      // A la derecha de la última vela no hay barras: se ubica por índice lógico (una vela = 15 min).
      if (lastBarTime != null && time > lastBarTime) {
        const logical = (barCount - 1) + (time - lastBarTime) / BAR_SECONDS;
        try { return timeScale.logicalToCoordinate(logical); } catch { return null; }
      }

      const x = safeTimeToCoordinate(timeScale, time);
      if (x != null) return x;
      if (firstBarTime != null && time < firstBarTime) return 0;
      return null;
    }

    // Las primitivas no se repintan solas al cambiar sus datos: este cambio de opciones vacío lo fuerza.
    function forceRepaint() {
      series.applyOptions({});
    }

    // Valor en USD (1 contrato) entre las dos líneas: ticks x tick value. null si no hay datos.
    function zoneValueText(zone, multiple = 1) {
      if (!zone.supply || !(tickSize > 0) || !(tickValue > 0)) return null;
      const ticks = Math.round(Math.abs(zone.supply.price - zone.demand.price) / tickSize);
      return String(Number((ticks * multiple * tickValue).toFixed(2)));
    }

    const RR_TARGET_MULTIPLES = [1, 2, 3];

    // Riesgo de una zona en ticks (distancia entre sus dos líneas); 0 si no hay tick size.
    function riskTicks(zone) {
      if (!zone.supply || !(tickSize > 0)) return 0;
      return Math.round(Math.abs(zone.supply.price - zone.demand.price) / tickSize);
    }

    // Precios de las líneas de objetivo de Risk:Reward: 1x, 2x y 3x el riesgo medido desde la línea 1,
    // hacia el lado contrario al del dibujo. dir = -1 (hacia abajo) si se dibujó de abajo hacia arriba.
    function rrTargets(zone) {
      if (!zone.supply) return [];
      const risk = Math.abs(zone.supply.price - zone.demand.price);
      const dir = zone.supply.price > zone.demand.price ? -1 : 1;
      return RR_TARGET_MULTIPLES.map(multiple => ({
        multiple, dir, price: zone.demand.price + dir * multiple * risk,
      }));
    }

    // Posición X de un valor junto a las líneas: a la derecha si cabe en el panel; si no (zona
    // dibujada cerca del borde derecho), a la izquierda para que no quede recortado.
    // Los valores van pegados al extremo de la línea discontinua: poca separación horizontal, y
    // verticalmente apoyados justo encima (baseline alfabético) o colgando justo debajo (hanging).
    const LABEL_GAP = 3;
    const LABEL_RISE = 2;

    function labelX(ctx, text, left, right, hRatio) {
      const fits = right + LABEL_GAP * hRatio + ctx.measureText(text).width <= ctx.canvas.width;
      ctx.textAlign = fits ? 'left' : 'right';
      return fits ? right + LABEL_GAP * hRatio : left - LABEL_GAP * hRatio;
    }

    function drawRiskReward(ctx, zone, x0, yd, selected, hRatio, vRatio) {
      zone.profitHits = [];   // áreas clicables de los valores de profit (px CSS), se rehacen en cada dibujo
      const ys = zone.supply ? series.priceToCoordinate(zone.supply.price) : null;
      const left = x0 * hRatio;
      const right = (x0 + RR_LENGTH_PX) * hRatio;

      if (ys != null) {
        ctx.fillStyle = `rgba(149, 152, 161, ${selected ? 0.3 : 0.12})`;
        const top = Math.min(yd, ys) * vRatio;
        ctx.fillRect(left, top, right - left, Math.abs(ys - yd) * vRatio);
      }

      ctx.strokeStyle = RR_COLOR;
      ctx.lineWidth = (selected ? 3 : 1.5) * hRatio;
      ctx.setLineDash([6 * hRatio, 4 * hRatio]);
      [yd, ys].forEach(y => {
        if (y == null) return;
        ctx.beginPath();
        ctx.moveTo(left, y * vRatio);
        ctx.lineTo(right, y * vRatio);
        ctx.stroke();
      });
      ctx.setLineDash([]);

      const text = zoneValueText(zone);
      if (text !== null && ys != null) {
        ctx.font = `bold ${14 * vRatio}px sans-serif`;
        ctx.fillStyle = RR_RISK_TEXT;
        const labelLeft = labelX(ctx, text, left, right, hRatio);
        // Según el sentido del dibujo: de abajo hacia arriba (click 2 a mayor precio) el valor va
        // encima de la línea superior; al revés, debajo de la línea inferior. Siempre a la derecha.
        const drawnUpward = zone.supply.price > zone.demand.price;
        if (drawnUpward) {
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(text, labelLeft, Math.min(yd, ys) * vRatio - LABEL_RISE * vRatio);
        } else {
          ctx.textBaseline = 'hanging';
          ctx.fillText(text, labelLeft, Math.max(yd, ys) * vRatio + LABEL_RISE * vRatio);
        }
      }

      // Riesgo en ticks: a la IZQUIERDA de las líneas y al mismo nivel que el valor en USD (que va a la
      // derecha); se calcula con el tick size aunque no haya tick value.
      if (ys != null && tickSize > 0) {
        const ticksText = String(Math.round(Math.abs(zone.supply.price - zone.demand.price) / tickSize));
        const upward = zone.supply.price > zone.demand.price;
        ctx.font = `bold ${14 * vRatio}px sans-serif`;
        ctx.fillStyle = RR_TICKS_TEXT;
        // Siempre a la IZQUIERDA de las líneas (el USD y los objetivos van a la derecha).
        ctx.textAlign = 'right';
        let ticksX = left - LABEL_GAP * hRatio;
        // Cerca del borde derecho el USD pasa también a la izquierda: los ticks se apartan a su izquierda.
        const usdText = zoneValueText(zone);
        if (usdText !== null && right + LABEL_GAP * hRatio + ctx.measureText(usdText).width > ctx.canvas.width) {
          ticksX -= ctx.measureText(usdText).width + 8 * hRatio;
        }
        if (upward) {
          ctx.textBaseline = 'alphabetic';
          ctx.fillText(ticksText, ticksX, Math.min(yd, ys) * vRatio - LABEL_RISE * vRatio);
        } else {
          ctx.textBaseline = 'hanging';
          ctx.fillText(ticksText, ticksX, Math.max(yd, ys) * vRatio + LABEL_RISE * vRatio);
        }
      }

      // Objetivos 1x/2x/3x: mismas líneas grises discontinuas; el valor va al lado contrario del
      // dibujo (debajo de la línea si los objetivos están abajo, encima si están arriba).
      rrTargets(zone).forEach(target => {
        const y = series.priceToCoordinate(target.price);
        if (y == null) return;

        ctx.strokeStyle = RR_COLOR;
        ctx.lineWidth = (selected ? 3 : 1.5) * hRatio;
        ctx.setLineDash([6 * hRatio, 4 * hRatio]);
        ctx.beginPath();
        ctx.moveTo(left, y * vRatio);
        ctx.lineTo(right, y * vRatio);
        ctx.stroke();
        ctx.setLineDash([]);

        const targetText = zoneValueText(zone, target.multiple);
        if (targetText === null) return;
        ctx.font = `bold ${14 * vRatio}px sans-serif`;
        ctx.fillStyle = RR_PROFIT_TEXT;
        ctx.textBaseline = target.dir < 0 ? 'hanging' : 'alphabetic';
        const targetX = labelX(ctx, targetText, left, right, hRatio);
        const targetY = y * vRatio + (target.dir < 0 ? LABEL_RISE : -LABEL_RISE) * vRatio;
        ctx.fillText(targetText, targetX, targetY);

        // Área clicable del valor (con un margen): crea la plantilla ATM de este profit.
        const textWidth = ctx.measureText(targetText).width;
        const boxLeft = (ctx.textAlign === 'left' ? targetX : targetX - textWidth) / hRatio;
        const boxTop = (target.dir < 0 ? targetY : targetY - 14 * vRatio) / vRatio;
        zone.profitHits.push({
          x: boxLeft - 4, y: boxTop - 3, w: textWidth / hRatio + 8, h: 14 + 6, multiple: target.multiple,
        });
      });
    }

    class ZoneLinesPrimitive {
      attached() {}
      updateAllViews() {}
      paneViews() {
        return [{
          renderer() {
            return {
              draw(target) {
                target.useBitmapCoordinateSpace(scope => {
                  const ctx = scope.context;
                  const timeScale = chart.timeScale();
                  const hRatio = scope.horizontalPixelRatio;
                  const vRatio = scope.verticalPixelRatio;
                  const rightEdge = scope.bitmapSize.width;

                  zones.forEach(zone => {
                    const xd = xOf(timeScale, zone.demand.time);
                    const yd = series.priceToCoordinate(zone.demand.price);
                    const selected = zone === selectedZone;

                    if (zone.kind === 'rr') {
                      if (xd != null && yd != null) drawRiskReward(ctx, zone, xd, yd, selected, hRatio, vRatio);
                      return;
                    }

                    // Relleno entre las dos líneas: rojo tenue si Supply quedó arriba de Demanda,
                    // verde tenue si Demanda quedó arriba. Solo cuando la zona está completa.
                    if (zone.supply && xd != null && yd != null) {
                      const xs = xOf(timeScale, zone.supply.time);
                      const ys = series.priceToCoordinate(zone.supply.price);
                      if (xs != null && ys != null) {
                        const left = Math.max(xd, xs) * hRatio;
                        const top = Math.min(yd, ys) * vRatio;
                        const bottom = Math.max(yd, ys) * vRatio;
                        const alpha = selected ? 0.3 : 0.15;
                        ctx.fillStyle = zone.supply.price > zone.demand.price
                          ? `rgba(239, 83, 80, ${alpha})`
                          : `rgba(38, 166, 154, ${alpha})`;
                        ctx.fillRect(left, top, rightEdge - left, bottom - top);
                      }
                    }

                    // Valor de la zona en USD (1 contrato): ticks entre las dos líneas x tick value.
                    // Va a la derecha, centrado verticalmente entre las líneas.
                    const valueText = zoneValueText(zone);
                    if (valueText !== null && yd != null) {
                      const ys = series.priceToCoordinate(zone.supply.price);
                      if (ys != null) {
                        const text = valueText;
                        ctx.font = `bold ${14 * vRatio}px sans-serif`;
                        ctx.textAlign = 'right';
                        ctx.textBaseline = 'middle';
                        ctx.fillStyle = '#d1d4dc';
                        ctx.fillText(text, rightEdge - 10 * hRatio, ((yd + ys) / 2) * vRatio);
                      }
                    }

                    [[zone.demand, DEMAND_COLOR], [zone.supply, SUPPLY_COLOR]].forEach(([point, color]) => {
                      if (!point) return;
                      const x = xOf(timeScale, point.time);
                      const y = series.priceToCoordinate(point.price);
                      if (x == null || y == null) return;
                      ctx.strokeStyle = color;
                      ctx.lineWidth = (selected ? 4 : 2) * hRatio;
                      ctx.beginPath();
                      ctx.moveTo(x * hRatio, y * vRatio);
                      ctx.lineTo(rightEdge, y * vRatio);
                      ctx.stroke();
                    });
                  });
                });
              },
            };
          },
        }];
      }
    }

    const zonePrimitive = new ZoneLinesPrimitive();

    // createPriceLine ocupa siempre todo el ancho, así que solo se usa para la etiqueta del eje
    // derecho (lineVisible:false); la línea visible la dibuja la primitiva.
    function addAxisLabel(price, color) {
      return series.createPriceLine({
        price, color, lineWidth: 1, lineVisible: false, axisLabelVisible: true, title: '',
      });
    }

    function ensurePrimitive() {
      if (zonesAttached) return;
      series.attachPrimitive(zonePrimitive);
      zonesAttached = true;
    }

    // Quita la zona del gráfico (líneas, etiquetas del eje y selección).
    function removeZone(zone) {
      zone.labels.forEach(label => series.removePriceLine(label));
      const index = zones.indexOf(zone);
      if (index !== -1) zones.splice(index, 1);
      if (zone === selectedZone) selectedZone = null;
      if (zone === dzSzPending) dzSzPending = null;
    }

    // Persistencia: las zonas completas se envían a C#, que las guarda por símbolo.
    // Solo se guardan tiempo y precio (el tiempo ya es la hora "disfrazada de UTC" del eje).
    function persistZones() {
      const data = zones.filter(z => z.supply).map(z => ({ kind: z.kind, demand: z.demand, supply: z.supply }));
      postToHost({ type: 'zones', zones: data });
    }

    function postToHost(message) {
      try { window.chrome.webview.postMessage(JSON.stringify(message)); } catch { /* fuera de WebView2 */ }
    }

    // Aviso breve sobre el gráfico (resultado de crear una plantilla ATM): kind = ok | warn | error.
    let toastTimer = null;
    function showToast(text, kind) {
      const toast = document.getElementById('toast');
      toast.textContent = text;
      toast.style.background = kind === 'ok' ? '#26a69a' : kind === 'warn' ? '#b8860b' : '#ef5350';
      toast.classList.add('visible');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => toast.classList.remove('visible'), 3500);
    }

    // Carga las zonas guardadas (C# las manda al abrir el gráfico).
    function loadZones(list) {
      [...zones].forEach(removeZone);
      list.forEach(item => {
        // Las zonas guardadas antes de Risk:Reward no traen kind: son DZ/SZ.
        const kind = item.kind === 'rr' ? 'rr' : 'dzsz';
        zones.push({
          kind,
          demand: item.demand,
          supply: item.supply,
          labels: kind === 'dzsz' ? [addAxisLabel(item.demand.price, DEMAND_COLOR)] : [],
        });
      });
      ensurePrimitive();
      forceRepaint();
    }

    // Zona bajo el punto (px del gráfico): primero por cercanía a una de sus líneas y, si no, por
    // estar dentro del relleno. Se prueba de la más reciente a la más antigua.
    function zoneAt(point) {
      const TOLERANCE = 6;
      const timeScale = chart.timeScale();
      let inside = null;
      for (let i = zones.length - 1; i >= 0; i--) {
        const zone = zones[i];
        if (!zone.supply) continue;
        const x0 = xOf(timeScale, zone.demand.time);
        const yd = series.priceToCoordinate(zone.demand.price);
        const ys = series.priceToCoordinate(zone.supply.price);
        if (x0 == null || yd == null || ys == null || point.x < x0) continue;
        if (zone.kind === 'rr' && point.x > x0 + RR_LENGTH_PX + TOLERANCE) continue;
        // Risk:Reward también acierta sobre sus líneas de objetivo y el espacio hasta ellas.
        const ys_all = [yd, ys];
        if (zone.kind === 'rr') {
          rrTargets(zone).forEach(target => {
            const y = series.priceToCoordinate(target.price);
            if (y != null) ys_all.push(y);
          });
        }
        if (ys_all.some(y => Math.abs(point.y - y) <= TOLERANCE)) return zone;
        if (inside === null && point.y > Math.min(...ys_all) && point.y < Math.max(...ys_all)) inside = zone;
      }
      return inside;
    }

    // Valor de profit de Risk:Reward bajo el punto (px del gráfico), o null.
    function profitHitAt(point) {
      for (let i = zones.length - 1; i >= 0; i--) {
        const zone = zones[i];
        if (zone.kind !== 'rr' || !zone.profitHits) continue;
        const box = zone.profitHits.find(b =>
          point.x >= b.x && point.x <= b.x + b.w && point.y >= b.y && point.y <= b.y + b.h);
        if (box) return { zone, multiple: box.multiple };
      }
      return null;
    }

    function deleteSelectedZone() {
      if (selectedZone === null) return;
      removeZone(selectedZone);
      persistZones();
      forceRepaint();
    }

    function addZonePoint(time, rawPrice) {
      const price = snapToTick(rawPrice);

      ensurePrimitive();

      // DZ/SZ: solo la línea verde (Demanda) muestra su valor en el eje derecho; la roja se dibuja
      // igual pero sin etiqueta. Risk:Reward no usa etiquetas de eje.
      if (dzSzPending === null) {
        const zone = {
          kind: armedKind,
          demand: { time, price },
          supply: null,
          labels: armedKind === 'dzsz' ? [addAxisLabel(price, DEMAND_COLOR)] : [],
        };
        zones.push(zone);
        dzSzPending = zone;
      } else {
        // El 1er click fija el eje X de la zona: la roja nace en el mismo tiempo que la verde y
        // queda paralela a ella; el 2º click solo aporta el precio.
        dzSzPending.supply = { time: dzSzPending.demand.time, price };
        dzSzPending = null;
        persistZones();
      }

      forceRepaint();
    }

    // Idempotente (no es un toggle): C# guarda el estado y lo reenvía, así no se desincroniza.
    // Al cambiar el modo se descarta cualquier zona a medias (se borra la línea verde suelta): el
    // próximo click siempre empieza una zona nueva y nunca queda una zona incompleta sin guardar.
    // Solo un modo de dibujo a la vez: armar uno desplaza al otro; desarmar uno que no es el activo
    // no hace nada.
    function setArmed(kind, on) {
      const previous = armedKind;
      if (on) armedKind = kind;
      else if (armedKind === kind) armedKind = null;

      if (previous !== armedKind && dzSzPending !== null) {
        removeZone(dzSzPending);
        dzSzPending = null;
        forceRepaint();
      }
      if (armedKind !== null) selectedZone = null;
      return armedKind;
    }

    function setDzSzArmed(on) { return setArmed('dzsz', !!on); }
    function setRiskRewardArmed(on) { return setArmed('rr', !!on); }

    // Supr/Backspace borra la zona seleccionada; Esc quita la selección.
    document.addEventListener('keydown', event => {
      if (event.key === 'Delete' || event.key === 'Backspace') {
        deleteSelectedZone();
      } else if (event.key === 'Escape' && selectedZone !== null) {
        selectedZone = null;
        forceRepaint();
      }
    });

    // Tiempo del click: el de la vela si cae sobre una; si no, el que corresponde a esa posición, y a
    // la derecha de la última vela se extrapola en pasos de una vela (permite dibujar fuera de las velas).
    function timeAtPoint(param) {
      if (param.time !== undefined) return param.time;

      const timeScale = chart.timeScale();
      const inData = timeScale.coordinateToTime(param.point.x);
      if (inData != null) return inData;

      if (lastBarTime == null) return null;
      const logical = timeScale.coordinateToLogical(param.point.x);
      if (logical == null || logical <= barCount - 1) return null;
      return lastBarTime + Math.round(logical - (barCount - 1)) * BAR_SECONDS;
    }

    chart.subscribeClick(param => {
      if (!param.point) return;

      // Con el modo desarmado: tocar un valor de profit de Risk:Reward crea su plantilla ATM; si no, un
      // click selecciona la zona bajo el cursor (o quita la selección).
      if (armedKind === null) {
        const profit = profitHitAt(param.point);
        if (profit !== null) {
          const stopTicks = riskTicks(profit.zone);
          if (stopTicks >= 1) {
            postToHost({ type: 'atm', stopTicks, targetTicks: stopTicks * profit.multiple });
          }
          return;
        }

        const hit = zoneAt(param.point);
        if (hit !== selectedZone) {
          selectedZone = hit;
          forceRepaint();
        }
        return;
      }

      const price = series.coordinateToPrice(param.point.y);
      if (price == null) return;

      // Solo el 1er click necesita un tiempo (fija el eje X de la zona); el 2º usa el mismo X y
      // solo toma el precio, así que puede hacerse en cualquier punto del gráfico. param.time solo
      // viene cuando el click cae sobre una barra; en el espacio vacío (p. ej. a la derecha de la
      // última vela) se convierte el píxel x a tiempo. Si aun así es null, el click se ignora.
      let time = null;
      if (dzSzPending === null) {
        time = timeAtPoint(param);
        if (time == null) return;
      }

      addZonePoint(time, price);
    });
  </script>
</body>
</html>
